<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Obrigado pela Compra!</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family:'Inter',sans-serif;
      margin:0;
      padding:0;
      background:#fff0f3;
      text-align:center;
      color:#333;
    }

    .container {
      max-width:500px;
      margin:0 auto;
      padding:2rem;
    }

    .circle-img {
      width:120px;
      height:120px;
      border-radius:50%;
      border:4px solid #ff758f;
      margin:0 auto 1rem;
      display:block;
      object-fit:cover;
    }

    h1 {font-size:1.8rem;margin-bottom:.5rem}
    p {font-size:1rem;margin-bottom:1.5rem}

    .btn {
      background:#229ED9;
      color:#fff;
      padding:.8rem 1.6rem;
      text-decoration:none;
      border-radius:8px;
      font-weight:bold;
      display:inline-block;
      margin-top:1rem;
      transition:.2s
    }

    .btn:hover {filter:brightness(1.1)}
  </style>
</head>
<body>

  <div class="container">
    <img src="foto.png" alt="Tutorial de acesso" class="circle-img" />

    <h1>Obrigado pela sua compra!</h1>

    <p>Sua compra foi confirmada. Clique abaixo para entrar no grupo VIP exclusivo:</p>

    <a 
      id="telegram-btn"
      href="https://t.me/+I-pcyWQm0khmYzYx" 
      class="btn">
      Entrar no Grupo VIP
    </a>
  </div>


  <!-- ✅ APENAS CONEXÃO COM NETLIFY FUNCTION (NENHUM PIXEL/SDK NO FRONT) -->
  <script>
    // ==========================
    // CAPTURA DADOS DA URL
    // ==========================
    const urlParams = new URLSearchParams(window.location.search);

    const data = {
      email:
        (urlParams.get('email') ||
        urlParams.get('buyer_email') ||
        urlParams.get('customer_email') ||
        '').trim().toLowerCase(),

      phone:
        (urlParams.get('phone') ||
        urlParams.get('buyer_phone') ||
        urlParams.get('customer_phone') ||
        '').replace(/\D/g, ''),

      transaction_id:
        urlParams.get('transaction') ||
        urlParams.get('transaction_id') ||
        urlParams.get('order_id') ||
        `anon_${Date.now()}`,

      value: parseFloat(
        urlParams.get('value') ||
        urlParams.get('price') ||
        urlParams.get('amount') ||
        '18.00'
      ) || 18.00
    };

    if (data.phone.length === 10 || data.phone.length === 11) {
      data.phone = '55' + data.phone;
    }


    // ==========================
    // ENVIA EVENTOS PARA A NETLIFY FUNCTION
    // ==========================
    async function sendEvent(eventName, extra = {}) {
      try {
        const res = await fetch('/.netlify/functions/tiktok-event', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            event: eventName,
            ...data,
            ...extra,
            page: window.location.href
          })
        });

        const json = await res.json();
        console.log('✅ Evento enviado:', eventName, json);

      } catch (err) {
        console.error('❌ Erro ao enviar evento para Netlify:', err);
      }
    }


    // ==========================
    // ENVIO AUTOMÁTICO (1x POR TRANSAÇÃO)
    // ==========================
    const storageKey = `tt_purchase_${data.transaction_id}`;

    if (!localStorage.getItem(storageKey)) {
      setTimeout(async () => {
        await sendEvent('ViewContent');
        await sendEvent('Purchase', { num_items: 1 });
        localStorage.setItem(storageKey, '1');
      }, 800);
    }


    // ==========================
    // EVENTO NO BOTÃO TELEGRAM
    // ==========================
    document
      .getElementById('telegram-btn')
      .addEventListener('click', () => {
        sendEvent('CompleteRegistration');
      });

  </script>

</body>
</html>
