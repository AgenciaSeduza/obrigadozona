<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obrigado pela Compra!</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {font-family:'Inter',sans-serif;margin:0;padding:0;background:#fff0f3;text-align:center;color:#333}
    .container {max-width:500px;margin:0 auto;padding:2rem}
    .circle-img {width:120px;height:120px;border-radius:50%;border:4px solid #ff758f;margin:0 auto 1rem;display:block;object-fit:cover}
    h1 {font-size:1.8rem;margin-bottom:.5rem}
    p {font-size:1rem;margin-bottom:1.5rem}
    .btn {background:#229ED9;color:#fff;padding:.8rem 1.6rem;text-decoration:none;border-radius:8px;font-weight:bold;display:inline-block;margin-top:1rem;transition:.2s}
    .btn:hover {filter:brightness(1.1)}
  </style>

  <!-- NOVO PIXEL TIKTOK: D4KUUQ3C77U4IAHDO5BG -->
  <script>
    !function (w, d, t) {
      w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=["page","track","identify","instances","debug","on","off","once","ready","alias","group","enableCookie","disableCookie"],ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);ttq.load=function(e){var r="https://analytics.tiktok.com/i18n/pixel/events.js";var n=document.createElement("script");n.type="text/javascript",n.async=!0,n.src=r+"?sdkid="+e+"&lib="+t;var e=document.getElementsByTagName("script")[0];e.parentNode.insertBefore(n,e)};ttq.load('D4KUUQ3C77U4IAHDO5BG');ttq.page();}(window, document, 'ttq');
  </script>
</head>
<body>
  <div class="container">
    <img src="foto.png" alt="Tutorial de acesso" class="circle-img" />
    <h1>Obrigado pela sua compra!</h1>
    <p>Sua compra foi confirmada. Clique abaixo para entrar no grupo VIP exclusivo:</p>
    <a id="telegram-btn" href="https://t.me/+I-pcyWQm0khmYzYx" class="btn">Entrar no Grupo VIP</a>
  </div>

  <script>
    const TIKTOK_PIXEL_ID = 'D4KUUQ3C77U4IAHDO5BG';
    const TIKTOK_ACCESS_TOKEN = 'f56c285ef22d3ad08db429e68c247ed2fc02f108';
    const API_ENDPOINT = 'https://business-api.tiktok.com/open_api/v1.3/event/track/';

    // === PEGA DADOS DA URL (Hotmart, Kiwify, Braip, Monetizze etc) ===
    const urlParams = new URLSearchParams(window.location.search);
    const rawEmail = (urlParams.get('email') || urlParams.get('buyer_email') || urlParams.get('customer_email') || '').toLowerCase().trim();
    const transactionId = urlParams.get('transaction') || urlParams.get('transacao') || urlParams.get('order_id') || urlParams.get('transaction_id') || '';
    let phone = (urlParams.get('phone') || urlParams.get('buyer_phone') || urlParams.get('customer_phone') || '').replace(/\D/g, '');
    if (phone.length === 11) phone = '55' + phone;
    if (phone.length === 10) phone = '55' + phone;
    const phoneE164 = phone ? '+' + phone : '';
    const externalId = transactionId || rawEmail || 'guest_' + Date.now();

    const urlValue = parseFloat(urlParams.get('value') || urlParams.get('price') || urlParams.get('amount') || '18.00');
    const value = isNaN(urlValue) ? 18.00 : urlValue;

    // Hash do e-mail (SHA-256)
    async function sha256(str) {
      if (!str) return '';
      const buffer = new TextEncoder().encode(str);
      const hash = await crypto.subtle.digest('SHA-256', buffer);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Gera event_id único
    function generateEventId(name) {
      return `${name}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
    }

    // Envia evento com todos os identificadores (EMQ altíssimo)
    async function sendTikTokServerEvent(eventName, extraProps = {}) {
      const eventId = generateEventId(eventName);
      const hashedEmail = rawEmail ? await sha256(rawEmail) : '';
      const payload = {
        pixel_code: TIKTOK_PIXEL_ID,
        event: eventName,
        event_id: eventId,
        timestamp: new Date().toISOString(),
        context: {
          user_agent: navigator.userAgent,
          ip: '',
          user: {
            external_id: externalId ? [externalId] : [],
            phone_number: phoneE164 ? [phoneE164] : [],
            email: hashedEmail ? [hashedEmail] : []
          },
          page: { url: window.location.href, referrer: document.referrer || '' }
        },
        properties: {
          content_type: 'product',
          content_id: 'produto_vip',
          content_name: 'Acesso VIP - Vazadinhos das Famosas',
          currency: 'BRL',
          value: value,
          ...extraProps
        }
      };

      try {
        const res = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: { 'Access-Token': TIKTOK_ACCESS_TOKEN, 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (res.ok && json.code === 0) console.log(`[TikTok OK] ${eventName} marcado!`);
      } catch (e) {}
    }

    // === DISPARA EVENTOS 1x só ===
    (function() {
      if (localStorage.getItem('tiktok_fired_v15')) return;
      setTimeout(async () => {
        await sendTikTokServerEvent('ViewContent');
        await sendTikTokServerEvent('Purchase');
        if (window.ttq) ttq.track('CompletePayment', { value, currency: 'BRL', content_id: 'produto_vip' });
        localStorage.setItem('tiktok_fired_v15', 'true');
      }, 800);
    })();

    // CompleteRegistration no clique do Telegram
    document.getElementById('telegram-btn').addEventListener('click', async () => {
      await sendTikTokServerEvent('CompleteRegistration', { value });
      if (window.ttq) ttq.track('CompleteRegistration', { value, currency: 'BRL', content_id: 'produto_vip' });
    });
  </script>
</body>
</html>
